---
dontChroot: false
timeout: 300
script:
    - "-rm -rf /etc/calamares /var/log/calamares* /root/.cache/calamares"
    - "-rm -f /etc/xdg/autostart/90-calamares.desktop /usr/share/applications/install-quickshell.desktop"
    - "-rm -rf /usr/lib/live /etc/live /var/lib/live /lib/live"
    - "-rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb"
    - "-rm -rf /tmp/* /var/tmp/*"
    - "-rm -f /etc/apt/sources.list.d/*"
