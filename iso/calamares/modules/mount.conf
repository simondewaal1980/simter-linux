# Mount-configuratie voor de BTRFS-root.
#
# @rootfs is dezelfde subvolume-naam als op de bronmachine. De mountopties
# komen uit /proc/self/mountinfo daar: noatime, compress=zlib:3,
# discard=async en space_cache=v2. /boot/efi krijgt umask=0077.
#
# De extra subvolumes houden gegevens buiten de root-snapshots:
#   - /home       gebruikersdata mag nooit terugrollen met het systeem;
#   - /var/log    blijft schrijfbaar tijdens een snapshot-boot en bewaart logs;
#   - /var/cache  pakket- en applicatiecache hoeft niet in elke snapshot;
#   - /var/tmp    tijdelijke bestanden horen niet in een snapshot;
#   - /var/spool  cron-, mail- en printwachtrijen blijven buiten de rollback.
# /var/lib blijft bewust in @rootfs: de dpkg- en systemd-status moeten bij een
# rollback exact meelopen met de rest van het systeem.
---
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@rootfs
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/tmp
      subvolume: /@tmp
    - mountPoint: /var/spool
      subvolume: /@spool

mountOptions:
    - filesystem: default
      options: [defaults, noatime]
    - filesystem: btrfs
      options: [noatime, compress=zlib:3, discard=async, space_cache=v2]
    - filesystem: btrfs_swap
      options: [noatime, discard=async]
    - filesystem: efi
      options: [umask=0077]

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]
