---
dontChroot: false
timeout: 600
verbose: true
script:
    # Verwijder de live- en installatiepakketten vóór de initramfs wordt
    # gegenereerd. De pakketten zijn niet nodig in het doelssysteem en
    # live-boot-hooks in de initramfs zouden de boot kunnen verstoren.
    - "-dpkg --purge --force-depends live-boot live-boot-initramfs-tools live-config live-config-systemd live-config-doc live-tools live-task-localisation live-task-recommended calamares calamares-settings-debian"
    # Restanten van de live-sessie horen niet in het doelssysteem.
    - "-rm -f /etc/xdg/autostart/90-calamares.desktop"
    - "-rm -f /usr/share/applications/install-quickshell.desktop"
    - "-rm -f /etc/sddm.conf /etc/sudoers.d/live"
    - "-rm -rf /home/user /var/lib/live /etc/live /usr/lib/live"
